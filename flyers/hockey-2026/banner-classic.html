<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTL Hockey — Rink Banner (classic)</title>
<link rel="stylesheet" href="banner.css">
</head>
<body>
<!-- 8 ft x 3 ft dasher-board banner at quarter scale (2304x864). Option B:
     bright MTL house style — crest left, mascot as a medallion, QR right. -->
<div class="banner banner--classic">
  <div class="stripe stripe--top"></div>
  <div class="crest-col">
    <img src="../assets/mtl-logo.png" alt="Mountain Top League, West Orange">
  </div>
  <div class="text-col">
    <div class="kicker">West Orange youth hockey</div>
    <h1 class="headline">MTL HOCKEY</h1>
    <div class="tagline">All-volunteer rec league &middot; Ages 5 to middle school</div>
    <div class="pill-row">
      <span class="pill">Learn to play</span>
      <span class="pill">League games</span>
      <span class="pill">Street hockey</span>
    </div>
  </div>
  <div class="mascot-col">
    <img class="mascot mascot--blend" src="../assets/mascot-wo.jpg" alt="WO Mountaineer hockey mascot">
  </div>
  <div class="qr-col">
    <div class="qr-box">
      <img src="../assets/qr-hockey-rink.png" alt="QR code: hockey.mountaintopleague.com">
      <div class="scan">Scan to learn more</div>
    </div>
    <div class="url">hockey.mountaintopleague.com</div>
  </div>
  <div class="stripe stripe--bottom"></div>
</div>
</body>
</html>
