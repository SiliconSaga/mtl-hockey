<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTL Hockey — Rink Banner (fierce)</title>
<link rel="stylesheet" href="banner.css">
</head>
<body>
<!-- 8 ft x 3 ft dasher-board banner at quarter scale (2304x864). Option A:
     the WO game-day post as the left third, message center, QR right. -->
<div class="banner banner--fierce">
  <div class="poster-col">
    <img src="../assets/mascot-wo-post.jpg" alt="WO Mountaineer hockey game-day poster">
  </div>
  <div class="text-col">
    <div class="kicker">West Orange's own youth league</div>
    <h1 class="headline">MTL HOCKEY</h1>
    <div class="tagline">All volunteer &middot; All local &middot; All fun &middot; Since 1959</div>
    <div class="pill-row">
      <span class="pill">Mites</span>
      <span class="pill">Squirts</span>
      <span class="pill">Middle School</span>
      <span class="pill">Summer Street Hockey</span>
    </div>
  </div>
  <div class="qr-col">
    <div class="qr-box">
      <img src="../assets/qr-hockey-rink.png" alt="QR code: hockey.mountaintopleague.com">
      <div class="scan">Scan to learn more</div>
    </div>
    <div class="url">hockey.mountaintopleague.com</div>
  </div>
</div>
</body>
</html>
