<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTL Hockey — Rink Banner (dasher)</title>
<link rel="stylesheet" href="banner.css">
<style>
  /* 8 ft x 2.5 ft dasher banner at quarter scale: 2304x720 = 24in x 7.5in. */
  @page { size: 24in 7.5in; margin: 0; }
</style>
</head>
<body>
<div class="banner banner--dasher">
  <div class="dasher-url">hockey.mountaintopleague.com</div>
  <div class="dasher-art" role="img" aria-label="Mountain Top League dasher-board artwork with the WO Mountaineer mascot">
    <div class="dasher-tagline">An all-volunteer organization<br>serving the children of<br>West Orange, NJ since 1959</div>
  </div>
  <div class="dasher-qr"><img src="../assets/qr-hockey-rink.png" alt="QR code: hockey.mountaintopleague.com"></div>
</div>
</body>
</html>
