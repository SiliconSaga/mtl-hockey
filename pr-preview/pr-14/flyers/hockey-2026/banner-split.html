<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTL Hockey — Rink Banner (split)</title>
<link rel="stylesheet" href="banner.css">
</head>
<body>
<!-- 8 ft x 3 ft dasher-board banner at quarter scale (2304x864). Option C:
     mascot panel with the high-school bridge line, message center, QR right. -->
<div class="banner banner--split">
  <div class="mascot-col">
    <img class="mascot mascot--blend" src="../assets/mascot-wo.jpg" alt="WO Mountaineer hockey mascot">
    <div class="road">The road to WO hockey starts here</div>
  </div>
  <div class="text-col">
    <div class="kicker">Play local. Play MTL.</div>
    <h1 class="headline">MTL HOCKEY</h1>
    <div class="tagline">All-volunteer youth league &middot; Since 1959</div>
    <div class="pill-row">
      <span class="pill">Ages 5 &ndash; 14</span>
      <span class="pill">Ice &amp; street</span>
      <span class="pill">Codey &middot; Mennen &middot; O'Connor</span>
    </div>
  </div>
  <div class="qr-col">
    <div class="qr-box">
      <img src="../assets/qr-hockey-rink.png" alt="QR code: hockey.mountaintopleague.com">
      <div class="scan">Scan to join</div>
    </div>
    <div class="url">hockey.mountaintopleague.com</div>
  </div>
</div>
</body>
</html>
