title: MTL Hockey
description: >-
  MTL Hockey is part of the Mountain Top League, an all-volunteer organization
  serving the children of West Orange, NJ since 1959.
url: "https://siliconsaga.github.io"
baseurl: "/mtl-hockey"
# Subdomain era: set url to https://hockey.mountaintopleague.com, baseurl to "",
# and add a CNAME file containing hockey.mountaintopleague.com — one commit.

permalink: pretty
markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: page
