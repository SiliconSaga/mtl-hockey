title: MTL Hockey
description: >-
  MTL Hockey is part of the Mountain Top League, an all-volunteer organization
  serving the children of West Orange, NJ since 1959.
# Served at the hockey subdomain; the CNAME file at the repo root rides the
# deploy to gh-pages, where GitHub Pages picks the domain up. Old
# siliconsaga.github.io/mtl-hockey/ URLs redirect here automatically.
url: "https://hockey.mountaintopleague.com"
baseurl: ""

permalink: pretty
markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: page
